<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4d8f52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5732;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blob1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6daa72;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#4d8f52;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative blobs -->
  <ellipse cx="100" cy="80" rx="280" ry="200" fill="url(#blob1)" />
  <ellipse cx="1150" cy="580" rx="300" ry="220" fill="url(#blob1)" />

  <!-- Subtle leaf icon -->
  <g transform="translate(600, 160)" opacity="0.25">
    <path d="M0,-60 C30,-40 50,0 0,60 C-50,0 -30,-40 0,-60 Z" fill="white" />
  </g>

  <!-- Main text -->
  <text
    x="600"
    y="280"
    font-family="Georgia, serif"
    font-size="80"
    font-weight="400"
    fill="white"
    text-anchor="middle"
    letter-spacing="2"
  >Ostéo Beausoleil</text>

  <!-- Tagline -->
  <text
    x="600"
    y="350"
    font-family="Arial, sans-serif"
    font-size="32"
    font-weight="300"
    fill="rgba(255,255,255,0.85)"
    text-anchor="middle"
    letter-spacing="4"
  >OSTÉOPATHIE DO — AIX-EN-PROVENCE</text>

  <!-- Divider -->
  <line x1="480" y1="390" x2="720" y2="390" stroke="rgba(255,255,255,0.4)" stroke-width="1" />

  <!-- Subtitle -->
  <text
    x="600"
    y="430"
    font-family="Arial, sans-serif"
    font-size="22"
    fill="rgba(255,255,255,0.7)"
    text-anchor="middle"
    letter-spacing="1"
  >Consultations adultes · enfants · nourrissons · femmes enceintes</text>

  <!-- URL -->
  <text
    x="600"
    y="530"
    font-family="Arial, sans-serif"
    font-size="20"
    fill="rgba(255,255,255,0.5)"
    text-anchor="middle"
  >osteo-beausoleil.fr</text>
</svg>
